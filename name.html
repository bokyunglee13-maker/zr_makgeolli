function romanChosung(word){
  word = word.toLowerCase().replace(/[^a-z]/g,''); if(!word) return '';
  const tk=[];
  for(let i=0;i<word.length;){
    const two=word.slice(i,i+2);
    if(DIGRAPHS[two]){ tk.push({c:true,cho:DIGRAPHS[two]}); i+=2; continue; }
    const ch=word[i];
    if(VOWELS.includes(ch)){ tk.push({c:false,v:ch}); i++; continue; }
    if(ch==='y'){ const nx=word[i+1]; tk.push(nx&&VOWELS.includes(nx)?{c:true,cho:'ㅇ'}:{c:false,v:'y'}); i++; continue; }
    tk.push({c:true,cho:LATIN[ch]||'ㅇ'}); i++;
  }
  let out='';
  for(let i=0;i<tk.length;i++){
    const cur=tk[i],prev=tk[i-1],prevV=prev&&!prev.c;
    if(cur.c){ const nextV=tk[i+1]&&!tk[i+1].c; let va=false; for(let j=i+1;j<tk.length;j++){ if(!tk[j].c){va=true;break;} } if(nextV||(!prevV&&va)) out+=cur.cho; }
    else { if(i===0||(prevV&&prev.v!==cur.v)) out+='ㅇ'; }
  }
  return out;
}
function toChosung(name){
  const words=(name||'').trim().split(/\s+/).filter(Boolean); const out=[];
  for(const w of words){
    let part='';
    if(/[가-힣ㄱ-ㅎ]/.test(w)){ for(const ch of w){ const c=ch.charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3) part+=CHO[Math.floor((c-0xAC00)/588)]; else if(c>=0x3131&&c<=0x314E) part+=ch; } }
    else { const key=w.toLowerCase().replace(/[^a-z]/g,''); part=NAME_MAP[key]||romanChosung(w); }
    if(part) out.push(part);
  }
  return out.join(' ')||'ㅈㄹ';
}

function fit(ctx,t,w,max,maxW){ let s=max; ctx.font=`${w} ${s}px Paperlogy`; while(ctx.measureText(t).width>maxW&&s>24){ s-=8; ctx.font=`${w} ${s}px Paperlogy`; } }

  x.font='700 38px Paperlogy'; x.fillText(d.slogan,W/2,1645);

  x.font='400 24px Paperlogy'; x.fillText('DOOTA MALL B2F · 2026.6.8 – 7.8',W/2,1760);
}
async function open(){ const v=genInput.value.trim(); if(!v)return; await draw(v,toChosung(v)); cardOverlay.classList.add('show'); }
genBtn.addEventListener('click',open);
genInput.addEventListener('keydown',e=>{ if(e.key==='Enter') open(); });
document.getElementById('card-close').addEventListener('click',()=>cardOverlay.classList.remove('show'));
function blob(){ return new Promise(r=>storyCanvas.toBlob(r,'image/png')); }
function dl(){ return blob().then(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='zr-name.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }); }
document.getElementById('card-save').addEventListener('click',dl);
document.getElementById('card-share').addEventListener('click',async()=>{
  const b=await blob(); const f=new File([b],'zr-name.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],text:'내 ㅈㄹ 이름 🍶 @zr.makgeolli'});}catch(e){} }
  else { await dl(); alert(I18N[LANG].fb); }
});
applyLang(LANG);
